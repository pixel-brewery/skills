name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact source requested by the trusted dependency controller
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require the requested dependency source
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: test -z "$EXPECTED_HEAD_SHA" || test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
      - name: Verify the dependency-free trusted controller
        run: node --test infra/nx-tasks/src/executors/dependabot-merge/*.spec.mjs
      - run: corepack enable
      - run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: yarn verify
      - name: Install the acceptance browser
        run: yarn exec playwright install --with-deps chromium
      - name: Exercise browser pairing and reconnect
        run: yarn nx run fixture-browser:e2e
      - name: Install the OS credential service
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-keyring libsecret-tools dbus-daemon
      - name: Exercise the isolated Electron client
        run: |
          dbus-run-session -- sh -eu -c '
            export XDG_DATA_HOME="$(mktemp -d)"
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            chmod 700 "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
            trap '\''rm -rf "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"'\'' EXIT
            openssl rand -hex 32 | gnome-keyring-daemon --daemonize --unlock --components=secrets
            printf %s remote-keyring-check | secret-tool store --label=Remote-CI application remote-ci purpose acceptance
            test "$(secret-tool lookup application remote-ci purpose acceptance)" = remote-keyring-check
            secret-tool clear application remote-ci purpose acceptance
            xvfb-run -a yarn nx run fixture-desktop:e2e
          '
      - name: Verify source and generated-file drift
        run: |
          yarn agents:sync
          yarn source:check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require the requested dependency source
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: test -z "$EXPECTED_HEAD_SHA" || test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.14.3'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: corepack enable
      - run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: yarn native:check
      - run: yarn nx run remote-capacitor:android-compile
      - run: yarn nx run fixture-mobile:android-compile

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require the requested dependency source
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: test -z "$EXPECTED_HEAD_SHA" || test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
      - run: corepack enable
      - run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: yarn native:check
      - run: yarn nx run remote-capacitor:ios-compile
      - run: yarn nx run remote-capacitor:ios-test
      - run: yarn nx run fixture-mobile:ios-compile
