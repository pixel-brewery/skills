name: Validate skills
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact source requested by the trusted dependency controller
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Require the requested dependency source
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: test -z "$EXPECTED_HEAD_SHA" || test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
      - run: node --test .github/scripts/createDependabotAutomation.spec.mjs
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: node scripts/verify-public-content.mjs
      - run: node --test scripts/verify-public-content.spec.mjs
  quality-gate:
    name: Quality Gate
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful skill validation and inheritance tests
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATE_RESULT" != success ]; then
            echo 'Skill validation and inheritance tests must succeed.' >&2
            exit 1
          fi
