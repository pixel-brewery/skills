name: Merge verified Dependabot updates

on:
  workflow_run:
    workflows: ['Validate skills']
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository_id == '1440603148'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # Load only trusted default-branch code; never install PR dependencies or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Reconcile dependency branches and their verified exact heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node --input-type=module -e
          "import { createDependabotAutomation } from './.github/scripts/createDependabotAutomation.mjs';
          await createDependabotAutomation().runFromEnvironment();"
